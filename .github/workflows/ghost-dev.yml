name: Continuous Ghost Progression

on:
  schedule:
    # 4 realistic daily trigger windows (EST): 11:15 AM, 3:45 PM, 7:30 PM, 10:45 PM
    - cron: '15 15 * * *'
    - cron: '45 19 * * *'
    - cron: '30 23 * * *'
    - cron: '45 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Configure Git Author
        run: |
          git config --global user.name "${{ secrets.GHOST_GIT_NAME || 'Vansh Singh' }}"
          git config --global user.email "${{ secrets.GHOST_GIT_EMAIL || 'singhvansh@outlook.com' }}"

      - name: Run Ghost Developer Engine
        env:
          GHOST_GIT_NAME: ${{ secrets.GHOST_GIT_NAME || 'Vansh Singh' }}
          GHOST_GIT_EMAIL: ${{ secrets.GHOST_GIT_EMAIL || 'singhvansh@outlook.com' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m ghost_engine.runner --repo .
