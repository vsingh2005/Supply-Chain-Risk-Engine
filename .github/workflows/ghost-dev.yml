name: Continuous Ghost Progression

on:
  schedule:
    # Runs Tuesday, Thursday, Sunday at 16:30 UTC (12:30 PM EST)
    - cron: '30 16 * * 0,2,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Configure Git Author
        run: |
          git config --global user.name "${{ secrets.GHOST_GIT_NAME || 'Vansh Singh' }}"
          git config --global user.email "${{ secrets.GHOST_GIT_EMAIL || 'singhvansh@outlook.com' }}"

      - name: Run Ghost Developer Engine
        env:
          GHOST_GIT_NAME: ${{ secrets.GHOST_GIT_NAME || 'Vansh Singh' }}
          GHOST_GIT_EMAIL: ${{ secrets.GHOST_GIT_EMAIL || 'singhvansh@outlook.com' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m ghost_engine.runner --repo . --force --no-jitter
