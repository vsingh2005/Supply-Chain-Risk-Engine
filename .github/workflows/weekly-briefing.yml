name: Weekly Engineering & Interview Briefing

on:
  schedule:
    # Runs every Sunday at 23:00 UTC (7:00 PM EST)
    - cron: '0 23 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and Dispatch Weekly Briefing
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.office365.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'singhvansh@outlook.com' }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python -m ghost_engine.weekly_briefing
