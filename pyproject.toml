[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-risk-engine"
version = "0.1.0"
description = "Quantitative supply chain risk modeling, Monte Carlo simulation, and inventory optimization engine."
authors = [{ name = "Vansh Singh" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "pulp>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [".ghost", "ghost_engine"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401", "E501"]
